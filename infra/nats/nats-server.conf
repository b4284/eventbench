# nats-server config for eventbench (mounted read-only by infra/nats/up.sh).
port: 4222
http_port: 8222

# Inline uploads of up to 16 MiB raw travel as ~22 MiB base64 JSON messages (no claim check).
max_payload: 64MB
# Per-client outbound buffer before the server treats a client as a slow consumer.
max_pending: 512MB
write_deadline: "30s"

jetstream {
  store_dir: "/data"
  max_file_store: 50GB
  max_memory_store: 2GB
  # "2m" = nats-server default (written to the OS on PubAck, fsynced periodically); "always" = fsync every write.
  sync_interval: "__SYNC_INTERVAL__"   # substituted by up.sh (NATS_SYNC_INTERVAL)
}
