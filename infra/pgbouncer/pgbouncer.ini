;; PgBouncer for eventbench — transaction pooling in front of Postgres (same pod => 127.0.0.1:5432)
[databases]
bench = host=127.0.0.1 port=5432 dbname=bench

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = bench
stats_users = bench

pool_mode = transaction
;; server connections per (db,user) pair — the main knob to sweep
default_pool_size = 64
min_pool_size = 16
reserve_pool_size = 16
reserve_pool_timeout = 1
max_client_conn = 10000
max_db_connections = 0

;; protocol-level prepared statements in transaction mode (PgBouncer >= 1.21)
max_prepared_statements = 200

server_reset_query =
server_check_delay = 30
query_wait_timeout = 120
ignore_startup_parameters = extra_float_digits,search_path,options
pkt_buf = 8192
log_connections = 0
log_disconnections = 0
stats_period = 10
