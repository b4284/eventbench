# eventbench overrides, mounted as /etc/rabbitmq/conf.d/90-eventbench.conf
default_user = bench
default_pass = bench

# RabbitMQ 4.x defaults to 16 MiB; inline large uploads are up to ~22 MB of base64 JSON.
max_message_size = 67108864

# Management stats refresh (default 5 s) — used for backlog (ready + unacked) and time series.
# (Quorum queues additionally report on their own tick: up.sh sets quorum_tick_interval=1000 via erl args.)
collect_statistics_interval = 1000
